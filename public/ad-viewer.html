<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Patrocinador · Conoscamosnos</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background:
          radial-gradient(circle at 18% 15%, rgba(232, 168, 56, 0.16), transparent 55%),
          radial-gradient(circle at 85% 85%, rgba(220, 62, 109, 0.16), transparent 52%),
          #0c0b10;
        color: #f4f4f5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        border-radius: 22px;
        padding: 20px;
        background: linear-gradient(180deg, rgba(28, 25, 36, 0.96), rgba(16, 15, 22, 0.98));
        border: 1px solid rgba(255, 255, 255, 0.11);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      }
      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(245, 158, 11, 0.14);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #fbbf24;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .timer-pill {
        padding: 5px 11px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .timer-pill.done {
        background: rgba(16, 185, 129, 0.18);
        border: 1px solid rgba(16, 185, 129, 0.4);
        color: #6ee7b7;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.3;
      }
      p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: #a1a1aa;
      }
      .progress-track {
        margin-top: 14px;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #f59e0b, #ec4899, #10b981);
        transition: width 0.25s linear;
      }
      .sponsor-box {
        margin-top: 16px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px dashed rgba(255, 255, 255, 0.14);
        text-align: center;
      }
      .sponsor-note {
        font-size: 11px;
        color: #d4d4d8;
        margin-bottom: 10px;
      }
      .sponsor-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.09);
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .sponsor-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      .status-line {
        margin-top: 12px;
        font-size: 11px;
        color: #9ca3af;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top-row">
        <span class="badge">Conoscamosnos · Sponsor</span>
        <span id="timerPill" class="timer-pill">12s</span>
      </div>

      <h1 id="headline">Reproduciendo anuncio recompensado</h1>
      <p id="subtitle">Mantén esta vista abierta unos segundos para obtener tu recompensa gratis.</p>

      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <div class="sponsor-box" id="sponsorBox">
        <div class="sponsor-note" id="sponsorNote">
          Conectando con red publicitaria Monetag...
        </div>
        <a
          id="sponsorLink"
          class="sponsor-btn"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          style="display: none;"
        >
          Visitar oferta patrocinada
        </a>
      </div>

      <div class="status-line" id="statusLine">Verificando sesión...</div>
    </div>

    <script>
      (function () {
        var CHANNEL_NAME = 'conoscamosnos_ad_reward';
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token') || '';
        var target = params.get('target') || 'este perfil';
        var purpose = params.get('purpose') || 'like';
        var duration = Math.max(5, Math.min(60, parseInt(params.get('duration') || '12', 10) || 12));
        var zone = params.get('zone') || '311878';
        var scriptSrc = params.get('src') || 'https://quge5.com/88/tag.min.js';
        var rawDirect = params.get('direct') || '';
        var safeDirect = /^https?:\/\//i.test(rawDirect) ? rawDirect : '';

        var timerPill = document.getElementById('timerPill');
        var headline = document.getElementById('headline');
        var subtitle = document.getElementById('subtitle');
        var progressFill = document.getElementById('progressFill');
        var sponsorNote = document.getElementById('sponsorNote');
        var sponsorLink = document.getElementById('sponsorLink');
        var statusLine = document.getElementById('statusLine');

        headline.textContent =
          purpose === 'unlock_chat'
            ? 'Desbloqueando chat con ' + target
            : 'Desbloqueando acceso para ' + target;
        subtitle.textContent =
          'Espera ' + duration + ' segundos para reclamar tu acceso gratis sin gastar diamantes.';
        timerPill.textContent = duration + 's';

        if (safeDirect) {
          sponsorLink.href = safeDirect;
          sponsorLink.style.display = 'inline-flex';
          sponsorNote.textContent = 'Patrocinador activo · Puedes esperar aquí o explorar el enlace.';
        }

        // Siempre cargar el MultiTag de Monetag en este contexto aislado (nunca en la app principal)
        try {
          if (/^https:\/\/[a-z0-9.-]+\//i.test(scriptSrc)) {
            var tagScript = document.createElement('script');
            tagScript.src = scriptSrc;
            tagScript.async = true;
            tagScript.setAttribute('data-cfasync', 'false');
            tagScript.setAttribute('data-zone', zone);
            tagScript.onload = function () {
              statusLine.textContent = 'Anuncio Monetag cargado · Contando tiempo...';
            };
            tagScript.onerror = function () {
              statusLine.textContent = 'Patrocinio en curso · Contando tiempo...';
            };
            document.head.appendChild(tagScript);
          }
        } catch (e) {
          statusLine.textContent = 'Patrocinio en curso...';
        }

        function notifyHost(type, extra) {
          var payload = {
            channel: CHANNEL_NAME,
            type: type,
            token: token,
            purpose: purpose,
            elapsed: duration,
            at: Date.now(),
          };
          if (extra) {
            for (var k in extra) payload[k] = extra[k];
          }
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(payload, window.location.origin);
            }
          } catch (e) {}
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage(payload, window.location.origin);
            }
          } catch (e) {}
          try {
            if ('BroadcastChannel' in window) {
              var bc = new BroadcastChannel(CHANNEL_NAME);
              bc.postMessage(payload);
              bc.close();
            }
          } catch (e) {}
          try {
            if (token && type === 'ad_completed') {
              window.localStorage.setItem('conoscamosnos_ad_done_' + token, JSON.stringify(payload));
            }
          } catch (e) {}
        }

        var startedAt = Date.now();
        var completed = false;

        var interval = window.setInterval(function () {
          var elapsed = (Date.now() - startedAt) / 1000;
          var ratio = Math.min(1, elapsed / duration);
          var remaining = Math.max(0, Math.ceil(duration - elapsed));

          progressFill.style.width = Math.round(ratio * 100) + '%';

          if (remaining > 0) {
            timerPill.textContent = remaining + 's';
            statusLine.textContent = 'Faltan ' + remaining + 's para completar la recompensa';
          } else if (!completed) {
            completed = true;
            window.clearInterval(interval);
            timerPill.textContent = 'Listo ✓';
            timerPill.className = 'timer-pill done';
            statusLine.textContent = '¡Recompensa lista! Toca el botón verde debajo para continuar.';
            notifyHost('ad_completed', { elapsed: duration });
          }
        }, 200);
      })();
    </script>
  </body>
</html>
