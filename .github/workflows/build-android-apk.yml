name: Build Signed Android TWA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK build-tools and accept licenses
        run: |
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_PATH" ] || [ ! -d "$SDK_PATH" ]; then
            SDK_PATH="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"

          SDKMGR="$(command -v sdkmanager || find "$SDK_PATH" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMGR" ]; then
            if [ ! -d "$SDK_PATH/tools" ] && [ ! -d "$SDK_PATH/bin" ]; then
              ln -s "$(dirname "$SDKMGR")" "$SDK_PATH/bin"
            fi
            yes | "$SDKMGR" --sdk_root="$SDK_PATH" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$SDK_PATH" "build-tools;36.1.0" "platforms;android-36" "platforms;android-35" "platform-tools"
          fi
          ls -ld "$SDK_PATH/bin" "$SDK_PATH/build-tools/36.1.0"

      - name: Install Bubblewrap CLI and configure paths
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p "$HOME/.bubblewrap"
          python3 -c 'import json, os; json.dump({"jdkPath": os.environ["JAVA_HOME"], "androidSdkPath": os.environ["ANDROID_HOME"]}, open(os.path.expanduser("~/.bubblewrap/config.json"), "w"))'
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate release keystore and Digital Asset Links
        id: keystore
        run: |
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"

          rm -f /tmp/conoscamosnos-release.keystore
          keytool -genkeypair -v \
            -keystore /tmp/conoscamosnos-release.keystore \
            -alias conoscamosnos \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Conoscamosnos, OU=Mobile, O=Conoscamosnos, L=Caracas, ST=DC, C=VE"

          KEY_INFO="$(keytool -list -v -keystore /tmp/conoscamosnos-release.keystore -alias conoscamosnos -storepass "$PASS")"
          python3 - "$KEY_INFO" << 'PY'
          import json, re, sys
          raw = sys.argv[1]
          m = re.search(r"SHA256:\s*([0-9A-Fa-f:]+)", raw)
          if not m:
              raise SystemExit("SHA256 fingerprint not found in keytool output")
          fp = m.group(1).strip().upper()
          payload = [{
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                  "namespace": "android_app",
                  "package_name": "app.vercel.conoscamosnos.twa",
                  "sha256_cert_fingerprints": [fp]
              }
          }]
          with open("/tmp/assetlinks.json", "w") as f:
              json.dump(payload, f, indent=2)
          print("Generated assetlinks.json with SHA256:", fp)
          PY

      - name: Build signed Android TWA APK
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ env.KEYSTORE_PASS }}
        run: |
          set -o pipefail
          (
            set -e
            bubblewrap update --skipVersionUpgrade
            sed -i 's/jcenter()/mavenCentral()/g' build.gradle app/build.gradle
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon
          ) 2>&1 | tee /tmp/twa-build.log || {
            grep -E -A 4 "FAILURE:|What went wrong:|Caused by:|> Could not|ERROR:" /tmp/twa-build.log | head -n 10 | sed 's/^/::error::/'
            exit 1
          }

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED_APK"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" /tmp/Conoscamosnos-aligned.apk
          "$APKSIGNER" sign \
            --ks /tmp/conoscamosnos-release.keystore \
            --ks-key-alias conoscamosnos \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEYSTORE_PASS \
            --out /tmp/Conoscamosnos.apk \
            /tmp/Conoscamosnos-aligned.apk

          ls -lh /tmp/Conoscamosnos.apk

      - name: Verify APK signature and package metadata
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs /tmp/Conoscamosnos.apk
          fi

      - name: Publish APK and assetlinks.json to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest /tmp/Conoscamosnos.apk /tmp/assetlinks.json --clobber
          else
            gh release create android-latest /tmp/Conoscamosnos.apk /tmp/assetlinks.json \
              --title "Conoscamosnos Android APK" \
              --notes "APK TWA oficial firmado para descarga directa desde Conoscamosnos."
          fi
